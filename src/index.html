<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MenuTodo</title>
  <link rel="stylesheet" href="output.css">
</head>
<body class="font-sans antialiased h-screen w-screen">
  <div id="app" class="bg-white rounded-xl shadow-lg overflow-hidden h-full w-full flex flex-col">
    <!-- Input section -->
    <div class="p-3 border-b border-gray-100">
      <div class="flex items-center gap-2">
        <input
          type="text"
          id="task-input"
          placeholder="Add a task…"
          class="flex-1 min-w-0 px-3 py-2 text-sm bg-gray-50 rounded-lg border border-transparent focus:border-gray-200 focus:bg-white focus:outline-none transition-all"
        />
        <button
          id="project-picker-btn"
          class="flex-shrink-0 flex items-center gap-1 px-2 py-2 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors"
          title="Assign project"
        >
          <span style="width:8px;height:8px;border-radius:50%;background:#d1d5db;display:inline-block;"></span>
        </button>
      </div>
    </div>

    <!-- Task list -->
    <div id="task-list" class="overflow-y-auto flex-1">
      <!-- Tasks will be rendered here -->
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
