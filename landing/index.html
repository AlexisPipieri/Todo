  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #F8F6F1;
      color: #1A1714;
      font-family: 'Instrument Sans', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      padding: 40px 24px;
    }

    .app-icon {
      width: 76px;
      height: auto;
      margin-bottom: 14px;
    }

    .wordmark {
      font-family: 'Fraunces', serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: #8A8278;
      margin-bottom: 52px;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(42px, 8vw, 72px);
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: -0.03em;
      text-align: center;
      margin-bottom: 24px;
    }

    h1 em {
      font-style: italic;
      font-weight: 200;
      color: #8A8278;
    }

    .desc {
      font-size: 16px;
      color: #8A8278;
      text-align: center;
      line-height: 1.65;
      max-width: 380px;
      text-wrap: balance;
      margin-bottom: 44px;
    }

    /* Same treatment as the tokens in the app's input: tinted background, colored text */
    .tok {
      border-radius: 4px;
      padding: 1px 5px;
      font-weight: 500;
      white-space: nowrap;
    }
    .tok-date  { color: #6366f1; background: rgba(99, 102, 241, 0.10); }
    .tok-label { color: #16a34a; background: rgba(34, 197, 94, 0.12); }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: #1A1714;
      color: #F8F6F1;
      text-decoration: none;
      padding: 13px 26px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
      transition: opacity 0.15s ease;
      margin-bottom: 14px;
    }

    .download-btn:hover { opacity: 0.82; }

    .download-btn svg {
      width: 14px;
      height: 14px;
      opacity: 0.65;
      flex-shrink: 0;
    }

    .note {
      font-size: 12px;
      color: #B5AFA8;
      text-align: center;
    }
  </style>
</head>
<body>

  <svg xmlns="http://www.w3.org/2000/svg" class="app-icon" viewBox="60 60 904 940" aria-hidden="true">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FCFAF6"/>
        <stop offset="1" stop-color="#EFEAE0"/>
      </linearGradient>
      <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
        <stop offset="1" stop-color="#1A1714" stop-opacity="0.12"/>
      </linearGradient>
      <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1A1714" flood-opacity="0.28"/>
      </filter>
    </defs>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#sh)"/>
    <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="url(#rim)" stroke-width="2"/>
    <path d="M318 540 L450 672 L670 402" fill="none" stroke="#1A1714" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="736" cy="288" r="42" fill="#FF6A00"/>
  </svg>
  <p class="wordmark">tdy</p>

  <h1>A to-do list<br><em>in your menu bar.</em></h1>

  <p class="desc">
    Click the icon, type a task, done. Add a deadline with <span class="tok tok-date">@tomorrow</span> and a label with <span class="tok tok-label">#work</span>. Everything stays on your Mac, no account.
  </p>

  <a href="https://github.com/AlexisPipieri/tdy/releases/latest/download/tdy-arm64.dmg" class="download-btn">
    <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 2v8M5 7l3 3 3-3M3 13h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Download for Mac
  </a>

  <p class="note">Free &nbsp;·&nbsp; macOS 12+ &nbsp;·&nbsp; Apple Silicon</p>

</body>
</html>
