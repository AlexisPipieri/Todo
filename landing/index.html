<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tdy — Always there. Never in the way.</title>
  <meta name="description" content="A minimal todo app that lives in your Mac menu bar.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,200;1,9..144,300&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #F8F6F1;
      color: #1A1714;
      font-family: 'Instrument Sans', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      padding: 40px 24px;
    }

    .wordmark {
      font-family: 'Fraunces', serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: #8A8278;
      margin-bottom: 52px;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(42px, 8vw, 72px);
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: -0.03em;
      text-align: center;
      margin-bottom: 24px;
    }

    h1 em {
      font-style: italic;
      font-weight: 200;
      color: #8A8278;
    }

    .desc {
      font-size: 16px;
      color: #8A8278;
      text-align: center;
      line-height: 1.65;
      max-width: 340px;
      margin-bottom: 44px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: #1A1714;
      color: #F8F6F1;
      text-decoration: none;
      padding: 13px 26px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
      transition: opacity 0.15s ease;
      margin-bottom: 14px;
    }

    .download-btn:hover { opacity: 0.82; }

    .download-btn svg {
      width: 14px;
      height: 14px;
      opacity: 0.65;
      flex-shrink: 0;
    }

    .note {
      font-size: 12px;
      color: #B5AFA8;
      text-align: center;
    }
  </style>
</head>
<body>

  <p class="wordmark">tdy</p>

  <h1>Always there.<br><em>Never in the way.</em></h1>

  <p class="desc">
    A todo app that lives in your Mac menu bar. One click away, always — without interrupting your flow.
  </p>

  <a href="https://github.com/AlexisPipieri/Todo/releases/latest/download/tdy-arm64.dmg" class="download-btn">
    <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 2v8M5 7l3 3 3-3M3 13h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Download for Mac
  </a>

  <p class="note">Free &nbsp;·&nbsp; macOS 12+ &nbsp;·&nbsp; Apple Silicon</p>

</body>
</html>
